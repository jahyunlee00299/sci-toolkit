[pytest]
testpaths = tests

# The test_*.py files in tests/ are standalone scripts, not pytest tests.
# They run their checks at module level and deliver the verdict with
# sys.exit(), so pytest's default Python collector dies mid-collection with
# INTERNALERROR (SystemExit -- measured 2026-08-08) as soon as it imports
# one. The official runner, doctor.py, executes them in subprocesses, which
# is why the failure was reserved for whoever cloned the repo and typed
# `pytest tests/`.
#
# So the default collection pattern is emptied with a name that never
# matches, and the pytest_collect_file hook in tests/conftest.py hands each
# script to a subprocess instead. Delete that line and pytest goes back to
# importing them and blows up immediately.
#
# KEEP THIS FILE ASCII-ONLY. iniconfig reads it with the locale encoding,
# not UTF-8, so a single non-ASCII byte makes `pytest tests/` die with
# UnicodeDecodeError before collection even starts on cp949 Windows
# (measured 2026-08-08) -- the same fresh-clone audience this wiring exists
# to protect.
python_files = __never_collected_by_import__.py
