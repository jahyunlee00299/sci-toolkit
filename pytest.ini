[pytest]
testpaths = tests

# tests/ 의 `test_*.py` 는 pytest 테스트가 아니라 standalone 스크립트다.
# 모듈 레벨에서 검사를 수행하고 sys.exit() 로 판정을 내므로, pytest 의 기본
# 파이썬 수집기가 이들을 import 하면 수집 도중 INTERNALERROR 가 난다
# (SystemExit — 실측 2026-08-08). 정식 러너인 doctor.py 는 subprocess 로 돌려서
# 이 고장이 보이지 않았고, 새로 clone 한 사람이 `pytest tests/` 를 쳤을 때만
# 드러났다.
#
# 그래서 기본 수집 패턴을 매치되지 않는 이름으로 비우고, tests/conftest.py 의
# pytest_collect_file 훅이 각 스크립트를 subprocess 로 실행하도록 넘긴다.
# 이 줄을 지우면 pytest 는 다시 import 를 시도하고 곧바로 터진다.
python_files = __never_collected_by_import__.py
