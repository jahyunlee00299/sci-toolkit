name: doctor

# 이 저장소의 검사 장치를 PR 마다 실제로 돌린다.
#
# 왜 필요한가: 회귀 테스트가 로컬 실행용으로만 있었다. 오늘 하루만 해도 그
# 테스트들이 실제 결함 3건을 잡았다 — `git push -f` 가 가드를 통과하던 것,
# 설치기가 기존 파일을 지우던 것, QC 게이트 오발동. 그런데 아무도 로컬에서
# doctor 를 돌리지 않고 PR 을 보내면 그 감지력은 존재하지 않는 것과 같다.
#
# doctor.py 는 SHA256SUMS 무결성·시크릿/연구마커 스캔·문서 참조 실존·라우팅 정합
# + tests/ 의 자체 테스트를 한 번에 돌리고 PASS/FAIL 을 낸다.
# (개수를 여기 적지 않는 것은 의도다 — 주석의 숫자는 아무 검사도 보지 않아서
#  반드시 낡는다. 실제 개수가 필요하면 doctor 출력이 말해 준다.) 그래서 여기서는 그것 하나만
# 부른다 — CI 가 검사 목록을 따로 들고 있으면 doctor 와 갈라져 드리프트가 난다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 의존성 목록은 tests/requirements.txt 하나에만 둔다. 워크플로에 직접 적으면
      # 그 목록이 두 곳이 되고, 실제로 그렇게 갈라져서 CI 를 두 번 왕복했다
      # (numpy 만 → scipy 누락 → pandas 누락). 목록은 깨끗한 venv 에서 실측했다.
      - name: Install test dependencies
        run: python -m pip install --quiet -r tests/requirements.txt

      # doctor 는 claude CLI 가 없으면 WARN 을 내고 계속 간다(FAIL 아님).
      # CI 러너에 CLI 가 없는 것은 정상 상태이므로 그대로 둔다.
      - name: Run doctor
        run: python doctor.py

      # doctor 가 PASS 여도 SHA256SUMS 가 커밋에 반영되지 않았을 수 있다.
      # 매니페스트를 다시 만들어 봐서 차이가 나면, 파일은 고쳤는데 해시를
      # 갱신하지 않고 올린 것이다 — 배포본 무결성 검증이 그 순간부터 거짓이 된다.
      - name: SHA256SUMS is up to date
        run: |
          python scripts/make_checksums.py --apply
          if ! git diff --quiet -- SHA256SUMS; then
            echo "::error::SHA256SUMS is stale — run 'python scripts/make_checksums.py --apply' and commit it."
            # 어떤 항목이 어떻게 달라졌는지 보여준다. --stat 만 찍으면 "62줄 다름"
            # 이라는 사실만 남고 왜 다른지는 알 수 없어, 로컬에서 재현을 시도하며
            # 왕복하게 된다(260807에 그렇게 한 라운드를 썼다).
            git diff -- SHA256SUMS | head -60
            exit 1
          fi
