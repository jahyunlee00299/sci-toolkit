name: doctor

# Actually run this repo's checking apparatus on every PR.
#
# Why this is needed: the regression tests only ever ran locally. In just one
# day, those tests caught 3 real defects — `git push -f` slipping past the
# guard, the installer deleting existing files, a QC gate false trigger. But
# if nobody runs doctor locally before sending a PR, that detection power
# might as well not exist.
#
# doctor.py runs SHA256SUMS integrity, secret/research-marker scanning,
# doc-reference existence, routing consistency, plus the tests/ self-tests,
# all in one pass, and produces a PASS/FAIL. (Deliberately not writing the
# count here — a number in a comment watches nothing, so it inevitably goes
# stale. doctor's own output states the real count when needed.) So this
# workflow calls only that one thing — if CI kept its own separate check
# list, it would drift apart from doctor.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep the dependency list in exactly one place, tests/requirements.txt.
      # Writing it directly into the workflow too creates a second copy, and
      # that split actually happened once and cost two round trips through CI
      # (numpy only -> scipy missing -> pandas missing). The list was measured
      # from a clean venv.
      - name: Install test dependencies
        run: python -m pip install --quiet -r tests/requirements.txt

      # doctor prints a WARN and keeps going if the claude CLI is missing
      # (not a FAIL). A CI runner having no CLI is expected, so leave it as is.
      # Second secret-scan layer. doctor runs gitleaks itself when the binary
      # is on PATH (check "Secret scan (gitleaks, second layer)"), so install
      # the binary here and let doctor own the verdict — no separate CI-only
      # check list to drift from doctor. Pinned release, checksum-free
      # download kept to the official GitHub release asset; bump deliberately.
      - name: Install gitleaks (second secret-scan layer)
        run: |
          set -euo pipefail
          GL_VERSION=8.24.3
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run doctor
        run: python doctor.py

      # doctor can PASS even when SHA256SUMS wasn't updated in the commit.
      # Regenerating the manifest and diffing it catches exactly that case —
      # a file was fixed but its hash was never refreshed before pushing,
      # which makes distribution integrity verification a lie from that
      # point on.
      - name: SHA256SUMS is up to date
        run: |
          python scripts/make_checksums.py --apply
          if ! git diff --quiet -- SHA256SUMS; then
            echo "::error::SHA256SUMS is stale — run 'python scripts/make_checksums.py --apply' and commit it."
            # Show which entries changed and how. --stat alone would only say
            # "62 lines differ" with no way to tell why, forcing a local
            # reproduction round trip (that happened once, 260807).
            git diff -- SHA256SUMS | head -60
            exit 1
          fi
