# ---------------- NOT canonical: per-experiment working stocks (WARN class only) ----------------
# A file whose value differs from an `observed` value of another file gets a WARN (never a FAIL):
# someone should confirm the working dilution is intentional. `file` is matched by basename so a
# file is never compared with itself.
[[undecided]]
id = "saltm.working_stock"
names = ["SaltM", "SaltM (working)"]
field = "stock_conc"
unit = "mM"
observed = [
  { file = "example_params.xlsx", value = 1000 },
  { file = "example_config.json", value = 100 },
]

[[undecided]]
id = "saltc.working_stock"
names = ["SaltC", "SaltC (working)"]
field = "stock_conc"
unit = "mM"
observed = [
  { file = "example_params.xlsx", value = 100 },
  { file = "example_config.json", value = 20 },
]
